# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: GitHubTraffic GitHubStats
    application: GitHubTraffic
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: output
        inputType: OutputTopic
        description: Name of the output topic to write into
        required: true
        value: github_data_v1
      - name: GH_TOKEN
        inputType: Secret
        description: GitHub token
        required: true
        secretKey: GH_TOKEN
      - name: GH_ORG
        inputType: FreeText
        description: ''
        required: false
        value: quixio
      - name: sleeptime
        inputType: FreeText
        description: ''
        required: false
        value: 14400
  - name: Write Referrals, PageViews, DailyViews to InfluxDB V3
    application: Write Stats to InfluxDB V3
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: input
        inputType: InputTopic
        description: This is the input topic
        required: true
        value: github_data_v1
      - name: INFLUXDB_HOST
        inputType: FreeText
        description: Host address for the InfluxDB instance.
        required: true
        value: https://us-east-1-1.aws.cloud2.influxdata.com
      - name: INFLUXDB_TOKEN
        inputType: Secret
        description: Authentication token to access InfluxDB.
        required: true
        secretKey: INFLUXDB_TOKEN
      - name: INFLUXDB_ORG
        inputType: FreeText
        description: Organization name in InfluxDB.
        required: false
        value: ContentSquad
      - name: INFLUXDB_MEASUREMENT_NAME
        inputType: FreeText
        description: The InfluxDB measurement to write data to. If not specified, the name of the input topic will be used
        required: false
        value: measurement1
      - name: INFLUXDB_DATABASE
        inputType: FreeText
        description: Database name in InfluxDB where data should be stored.
        required: true
        value: quix_github_stats
      - name: INFLUXDB_TAG_KEYS
        inputType: FreeText
        description: The tags to include when writing the measurement data
        required: false
        value: "['tag1', 'tag2']"
      - name: INFLUXDB_FIELD_KEYS
        inputType: FreeText
        description: The fields to include when writing the measurement data
        required: true
        value: "['field1','field2']"
      - name: CONSUMER_GROUP_NAME
        inputType: FreeText
        description: The name of the consumer group to use when consuming from Kafka
        required: true
        value: influxdb-sink-v1
      - name: TIMESTAMP_COLUMN
        inputType: FreeText
        description: 'The column containing the timestamp column. NOTE: Must be nanoseconds'
        required: false
        value: ''
  - name: Write Stats to DuckDB on MotherDuck
    application: Write Stats to DuckDB on MotherDuck
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: input
        inputType: InputTopic
        description: This is the input topic
        required: true
        value: github_data_v1
      - name: MOTHERDUCK_TOKEN
        inputType: Secret
        description: Authentication token to access InfluxDB.
        required: true
        secretKey: MOTHERDUCK_TOKEN
      - name: MOTHERDUCK_DATABASE
        inputType: FreeText
        description: Database name in InfluxDB where data should be stored.
        required: true
        value: github_stats
      - name: CONSUMER_GROUP_NAME
        inputType: FreeText
        description: The name of the consumer group to use when consuming from Kafka
        required: true
        value: duckdb-sink-v1

# This section describes the Topics of the data pipeline
topics:
  - name: quix-streams-gh-stats
    configuration:
      retentionInMinutes: -1
  - name: template-hello-quix-gh-stats
    configuration:
      retentionInMinutes: -1
  - name: github_data
  - name: trashcan
  - name: github_data_v1
