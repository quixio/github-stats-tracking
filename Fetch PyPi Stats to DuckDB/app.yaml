name: Fetch PyPi Stats to DuckDB
language: python
variables:
  - name: MOTHERDUCK_TOKEN
    inputType: Secret
    description: ''
    defaultValue: MD_TOKEN_DEVREL
    required: true
  - name: MOTHERDUCK_DATABASE
    inputType: FreeText
    description: ''
    defaultValue: ghstats
    required: false
  - name: TABLE_NAME
    inputType: FreeText
    description: ''
    defaultValue: pypiinstalls
    required: false
  - name: sleeptime
    inputType: FreeText
    description: ''
    defaultValue: 21600
    required: false
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
