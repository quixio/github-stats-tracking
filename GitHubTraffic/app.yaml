name: GitHubTraffic
language: Python
variables:
  - name: output
    inputType: OutputTopic
    description: Name of the output topic to write into
    defaultValue: trashcan
    required: true
  - name: GH_TOKEN
    inputType: Secret
    description: GitHub token
    defaultValue: GH_TOKEN
    required: true
  - name: GH_ORG
    inputType: FreeText
    description: ''
    defaultValue: quixio
    required: false
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
